<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Vistamark AI</title>
<script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
<style>
  :root {
    --gold: #D4A017;
    --gold-dark: #B88914;
    --navy: #1B2A4A;
    --near-black: #0E0E0E;
    --bg: #FAFAFA;
    --card: #FFFFFF;
    --border: #E5E5E5;
    --muted: #6B7280;
    --success-bg: #F0FDF4;
    --success-text: #166534;
    --success-border: #BBF7D0;
    --error-bg: #FEF2F2;
    --error-text: #991B1B;
    --error-border: #FECACA;
    --info-bg: #F3F4F6;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
  }
  body {
    font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--near-black);
    font-size: 14px;
    line-height: 1.4;
  }
  .header {
    background: var(--navy);
    color: white;
    padding: 12px 14px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .header img {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    object-fit: cover;
    border: 2px solid var(--gold);
    flex-shrink: 0;
  }
  .header-title {
    font-family: "PT Serif", Georgia, serif;
    font-size: 16px;
    font-weight: 700;
    color: white;
    line-height: 1.2;
  }
  .header-subtitle {
    font-size: 10.5px;
    color: var(--gold);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-top: 2px;
  }
  .container {
    padding: 14px;
  }
  .section {
    margin-bottom: 12px;
  }
  .section-label {
    font-size: 10.5px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--muted);
    margin-bottom: 6px;
  }
  textarea {
    width: 100%;
    padding: 9px 10px;
    border: 1px solid var(--border);
    border-radius: 4px;
    font-family: inherit;
    font-size: 13px;
    resize: vertical;
    min-height: 72px;
    background: var(--card);
  }
  textarea:focus {
    outline: none;
    border-color: var(--gold);
  }
  .button {
    width: 100%;
    padding: 12px 16px;
    background: var(--gold);
    color: var(--near-black);
    border: none;
    border-radius: 4px;
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
    transition: background 0.15s ease;
    min-height: 44px;
  }
  .button:hover:not(:disabled) {
    background: var(--gold-dark);
  }
  .button:disabled {
    background: #D1D5DB;
    color: #6B7280;
    cursor: not-allowed;
  }
  .button-secondary {
    background: var(--card);
    color: var(--navy);
    border: 1px solid var(--border);
    font-weight: 500;
  }
  .button-secondary:hover:not(:disabled) {
    background: var(--info-bg);
    border-color: var(--navy);
  }
  .status {
    margin-top: 10px;
    padding: 9px 12px;
    border-radius: 4px;
    font-size: 12px;
    display: none;
  }
  .status.visible { display: block; }
  .status.info {
    background: var(--info-bg);
    color: var(--near-black);
  }
  .status.error {
    background: var(--error-bg);
    color: var(--error-text);
    border: 1px solid var(--error-border);
  }
  .status.success {
    background: var(--success-bg);
    color: var(--success-text);
    border: 1px solid var(--success-border);
  }
  .result-block {
    margin-top: 14px;
    border: 1px solid var(--border);
    border-radius: 4px;
    background: var(--card);
    display: none;
  }
  .result-block.visible { display: block; }
  .result-header {
    padding: 8px 12px;
    background: #F9FAFB;
    border-bottom: 1px solid var(--border);
    font-size: 10.5px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--muted);
  }
  .result-body {
    padding: 12px 14px;
    font-size: 13.5px;
    line-height: 1.55;
    max-height: 360px;
    overflow-y: auto;
    color: var(--near-black);
  }
  .result-body p {
    margin: 0 0 12px 0;
  }
  .result-body p:last-child { margin-bottom: 0; }
  .result-body ul, .result-body ol {
    margin: 0 0 12px 0;
    padding-left: 24px;
  }
  .result-body li { margin-bottom: 4px; }
  .result-body a {
    color: var(--navy);
    text-decoration: underline;
  }
  .result-actions {
    padding: 8px 10px;
    border-top: 1px solid var(--border);
    background: #F9FAFB;
    display: flex;
    gap: 6px;
  }
  .result-actions .button { flex: 1; min-width: 0; }
  .footer {
    padding: 9px 14px;
    border-top: 1px solid var(--border);
    background: var(--card);
    font-size: 10px;
    color: var(--muted);
    text-align: center;
  }
  .spinner {
    display: inline-block;
    width: 12px;
    height: 12px;
    border: 2px solid #D1D5DB;
    border-top-color: var(--gold);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    vertical-align: middle;
    margin-right: 6px;
  }
  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  /* Mobile / narrow viewport tweaks for Outlook iOS/Android */
  @media (max-width: 380px) {
    .header { padding: 10px 12px; }
    .header img { width: 36px; height: 36px; }
    .header-title { font-size: 15px; }
    .container { padding: 12px; }
    .result-body { max-height: 280px; padding: 10px 12px; }
  }
</style>
</head>
<body>

<div class="header">
  <img src="randall.jpg" alt="Randall Stephens" onerror="this.style.display='none'" />
  <div>
    <div class="header-title">Vistamark AI</div>
    <div class="header-subtitle">Powered by Randall</div>
  </div>
</div>

<div class="container">

  <div class="section">
    <div class="section-label">Instructions for this draft (optional)</div>
    <textarea id="customInstructions" placeholder="e.g. mention the Tuesday call, lead with the answer, keep it cordial but firm"></textarea>
  </div>

  <button class="button" id="actionButton" onclick="runDraft()">Draft Reply</button>

  <div class="status" id="status"></div>

  <div class="result-block" id="resultBlock">
    <div class="result-header">Randall's Draft</div>
    <div class="result-body" id="resultBody"></div>
    <div class="result-actions">
      <button class="button" onclick="replaceBody()">Replace Body</button>
      <button class="button button-secondary" onclick="discardResult()">Discard</button>
    </div>
  </div>

</div>

<div class="footer">
  Vistamark Investments LLC &middot; Hinsdale &middot; Chicago &middot; Phoenix
</div>

<script>
  // -------- Configuration --------
  const ENDPOINT_URL = "https://vistamark-m365.vercel.app/api/inbound/from-addin";
  const ADDIN_SECRET = "LTBCiLpgSpxKgQOvSW7e7jdzvTknyx9P3oNucOaWb4pTWvSg";  // injected at deploy time
  // -------------------------------

  let currentDraftHtml = "";
  let currentDraftText = "";

  Office.onReady(function() {
    updateButtonLabel();
    setInterval(updateButtonLabel, 1500);
  });

  function updateButtonLabel() {
    const btn = document.getElementById("actionButton");
    if (!btn || btn.disabled) return;
    getCurrentBodyAsync(function(body) {
      const hasBody = body && body.trim().length > 20;
      btn.textContent = hasBody ? "Refine Draft" : "Draft Reply";
    });
  }

  function getCurrentBodyAsync(callback) {
    try {
      var item = Office.context.mailbox.item;
      if (!item || !item.body) { callback(""); return; }
      item.body.getAsync(Office.CoercionType.Text, function(result) {
        if (result.status === Office.AsyncResultStatus.Succeeded) {
          callback(result.value || "");
        } else {
          callback("");
        }
      });
    } catch (e) { callback(""); }
  }

  function getInboundContext(callback) {
    var item = Office.context.mailbox.item;
    var ctx = {
      subject: item.subject || "",
      recipients: { to: [], cc: [], bcc: [] },
      threadBody: "",
    };

    var tasks = [];

    if (item.to && item.to.getAsync) {
      tasks.push(new Promise(function(resolve) {
        item.to.getAsync(function(r) {
          if (r.status === Office.AsyncResultStatus.Succeeded && r.value) {
            ctx.recipients.to = r.value.map(function(x) { return x.emailAddress; }).filter(Boolean);
          }
          resolve();
        });
      }));
    } else if (item.to && Array.isArray(item.to)) {
      ctx.recipients.to = item.to.map(function(x) { return x.emailAddress; }).filter(Boolean);
    }
    if (item.cc && item.cc.getAsync) {
      tasks.push(new Promise(function(resolve) {
        item.cc.getAsync(function(r) {
          if (r.status === Office.AsyncResultStatus.Succeeded && r.value) {
            ctx.recipients.cc = r.value.map(function(x) { return x.emailAddress; }).filter(Boolean);
          }
          resolve();
        });
      }));
    } else if (item.cc && Array.isArray(item.cc)) {
      ctx.recipients.cc = item.cc.map(function(x) { return x.emailAddress; }).filter(Boolean);
    }

    tasks.push(new Promise(function(resolve) {
      item.body.getAsync(Office.CoercionType.Text, function(result) {
        if (result.status === Office.AsyncResultStatus.Succeeded) {
          ctx.threadBody = result.value || "";
        }
        resolve();
      });
    }));

    Promise.all(tasks).then(function() { callback(ctx); });
  }

  function runDraft() {
    var senderEmail = Office.context.mailbox.userProfile.emailAddress || "";
    var senderName = Office.context.mailbox.userProfile.displayName || "";

    setStatus("info", "Asking Randall...", true);
    setButtonDisabled(true);
    hideResult();

    getInboundContext(function(ctx) {
      getCurrentBodyAsync(function(currentBody) {
        var hasDraft = currentBody && currentBody.trim().length > 20;
        var mode = hasDraft ? "revise" : "guess";

        var payload = {
          sender_email: senderEmail,
          sender_name: senderName,
          mode: mode,
          subject: ctx.subject,
          recipients: ctx.recipients,
          thread_body: ctx.threadBody,
          draft_body: hasDraft ? currentBody : undefined,
          custom_instructions: document.getElementById("customInstructions").value.trim() || undefined,
        };

        fetch(ENDPOINT_URL, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "X-Addin-Secret": ADDIN_SECRET,
          },
          body: JSON.stringify(payload),
        })
        .then(function(res) {
          return res.json().then(function(json) { return { status: res.status, body: json }; });
        })
        .then(function(resp) {
          setButtonDisabled(false);
          if (resp.status !== 200 || !resp.body.draft_html) {
            var detail = resp.body.detail || resp.body.error || ("HTTP " + resp.status);
            setStatus("error", "Randall couldn't draft: " + detail, true);
            return;
          }
          currentDraftHtml = resp.body.draft_html;
          currentDraftText = resp.body.draft_text || "";
          // Render HTML preview so partner sees what Outlook will show.
          document.getElementById("resultBody").innerHTML = currentDraftHtml;
          showResult();
          var ms = resp.body.diagnostics && resp.body.diagnostics.durationMs;
          setStatus("success", "Draft ready" + (ms ? " (" + Math.round(ms / 100) / 10 + "s)" : "") + ".", true);
        })
        .catch(function(err) {
          setButtonDisabled(false);
          setStatus("error", "Network error: " + (err && err.message ? err.message : String(err)), true);
        });
      });
    });
  }

  function replaceBody() {
    if (!currentDraftHtml) return;
    var item = Office.context.mailbox.item;
    item.body.setSelectedDataAsync(currentDraftHtml, { coercionType: Office.CoercionType.Html }, function(result) {
      if (result.status === Office.AsyncResultStatus.Succeeded) {
        setStatus("success", "Draft inserted above the reply chain.", true);
        hideResult();
      } else {
        var msg = (result.error && result.error.message) ? result.error.message : "unknown error";
        setStatus("error", "Couldn't replace body: " + msg, true);
      }
    });
  }

  function discardResult() {
    currentDraftHtml = "";
    currentDraftText = "";
    hideResult();
    setStatus("info", "Discarded.", true);
    setTimeout(function() { setStatus("info", "", false); }, 1500);
  }

  function showResult() {
    document.getElementById("resultBlock").classList.add("visible");
  }
  function hideResult() {
    document.getElementById("resultBlock").classList.remove("visible");
  }

  function setStatus(kind, message, visible) {
    var el = document.getElementById("status");
    el.className = "status " + kind;
    el.textContent = "";
    if (visible && kind === "info" && message.indexOf("Asking") === 0) {
      var sp = document.createElement("span");
      sp.className = "spinner";
      el.appendChild(sp);
      el.appendChild(document.createTextNode(message));
    } else if (message) {
      el.textContent = message;
    }
    if (visible) el.classList.add("visible");
    else el.classList.remove("visible");
  }

  function setButtonDisabled(disabled) {
    document.getElementById("actionButton").disabled = disabled;
  }
</script>

</body>
</html>
